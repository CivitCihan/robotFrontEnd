<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Egitim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-sidebar">

<main class="education-container education-page">
  <header class="page-header">
    <h1 class="page-title">Egitim Merkezi</h1>
    <p class="page-subtitle">Gunluk ogrenme planini yurut, dersleri sirayla tamamla.</p>
  </header>

  <section class="education-stats">
    <article class="card stat-card">
      <h2>Tamamlanan Ders</h2>
      <p id="completedCount" class="stat-value">0</p>
    </article>
    <article class="card stat-card">
      <h2>Toplam Puan</h2>
      <p id="totalScore" class="stat-value">0</p>
    </article>
    <article class="card stat-card">
      <h2>Seri</h2>
      <p id="streakCount" class="stat-value">0 gun</p>
    </article>
  </section>

  <section id="lessonList" class="lesson-grid"></section>
</main>

<script src="js/sidebar.js"></script>
<script src="js/education.js"></script>

</body>
</html>
