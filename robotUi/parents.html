<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ebeveyn Paneli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-sidebar">

<header class="top-bar">
  <button onclick="goBack()">Geri</button>
  <h1>Ebeveyn Paneli</h1>
</header>

<main class="parent-container">
  <section class="card">
    <h2>Cocuk Profilleri</h2>
    <select id="childSelect"></select>
    <button onclick="addChild()">Yeni Profil</button>
  </section>

  <section class="card">
    <h2>Gelisim Durumu</h2>
    <p id="progressText">Henuz veri yok</p>
  </section>

  <section class="card">
    <h2>Gunluk Kullanim Suresi</h2>
    <input type="range" min="10" max="120" value="60" id="timeLimit">
    <span id="timeValue">60 dk</span>
  </section>

  <section class="card">
    <h2>Oyun Kontrolleri</h2>
    <label><input type="checkbox" checked> Matematik</label><br>
    <label><input type="checkbox" checked> Turkce</label><br>
    <label><input type="checkbox" checked> Ingilizce</label>
  </section>

  <section class="card">
    <h2>Donanim Kontrolleri</h2>
    <label><input type="checkbox" checked> Mikrofon</label><br>
    <label><input type="checkbox" checked> Kamera</label>
  </section>
</main>

<canvas id="faceCanvas" width="180" height="180"></canvas>

<script src="js/sidebar.js"></script>
<script src="js/miniFaceCanvas.js"></script>
<script src="js/parents.js"></script>

</body>
</html>
