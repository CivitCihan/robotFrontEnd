<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ebeveyn Paneli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-sidebar">

<main class="parent-container parent-page">
  <header class="page-header">
    <h1 class="page-title">Ebeveyn Paneli</h1>
    <p class="page-subtitle">Kullanim, icerik ve profil ayarlarini yonetin.</p>
  </header>

  <section class="parent-grid">
    <article class="card">
      <h2>Cocuk Profilleri</h2>
      <select id="childSelect"></select>
      <button class="main-btn" onclick="addChild()">Yeni Profil Ekle</button>
    </article>

    <article class="card">
      <h2>Gelisim Durumu</h2>
      <p id="progressText" class="progress-text">Henuz veri yok</p>
    </article>

    <article class="card">
      <div class="setting-head">
        <h2>Gunluk Kullanim Suresi</h2>
        <span id="timeValue" class="setting-value">60 dk</span>
      </div>
      <input type="range" min="10" max="120" value="60" id="timeLimit">
    </article>

    <article class="card">
      <h2>Oyun Kontrolleri</h2>
      <div class="toggle-list">
        <label class="toggle-row"><span>Matematik</span><input type="checkbox" checked></label>
        <label class="toggle-row"><span>Turkce</span><input type="checkbox" checked></label>
        <label class="toggle-row"><span>Ingilizce</span><input type="checkbox" checked></label>
      </div>
    </article>

    <article class="card">
      <h2>Donanim Kontrolleri</h2>
      <div class="toggle-list">
        <label class="toggle-row"><span>Mikrofon</span><input type="checkbox" checked></label>
        <label class="toggle-row"><span>Kamera</span><input type="checkbox" checked></label>
      </div>
    </article>

    <article class="card face-preview-card">
      <h2>Asistan Onizleme</h2>
      <div class="face-preview-wrap">
        <canvas id="faceCanvas" width="180" height="180"></canvas>
      </div>
    </article>
  </section>
</main>

<script src="js/sidebar.js"></script>
<script src="js/miniFaceCanvas.js"></script>
<script src="js/parents.js"></script>

</body>
</html>
