<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ayarlar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-sidebar">

<main class="settings settings-page">
  <header class="page-header">
    <h1 class="page-title">Genel Ayarlar</h1>
    <p class="page-subtitle">Ses, ekran ve profil ayarlarini buradan yonetin.</p>
  </header>

  <section class="setting-group">
    <div class="setting-head">
      <label for="volume">Ses Seviyesi</label>
      <span id="volumeValue" class="setting-value">50%</span>
    </div>
    <input type="range" min="0" max="100" value="50" id="volume">
  </section>

  <section class="setting-group">
    <div class="setting-head">
      <label for="brightness">Parlaklik</label>
      <span id="brightnessValue" class="setting-value">100%</span>
    </div>
    <input type="range" min="30" max="120" value="100" id="brightness">
  </section>

  <section class="setting-group">
    <div class="setting-head">
      <label for="profileSelect">Kisi Secimi</label>
    </div>
    <select id="profileSelect"></select>
  </section>

  <section class="setting-group">
    <p class="setting-note">Ebeveyn paneline gecis sifre ile korunur.</p>
    <button class="parent-btn" onclick="openParentLock()">Ebeveyn Ayarlari</button>
  </section>
</main>

<div id="parentLock" class="modal hidden">
  <div class="modal-content">
    <h2>Ebeveyn Girisi</h2>
    <input type="password" id="pinInput" maxlength="4" placeholder="****">
    <button class="main-btn" onclick="checkPin()">Giris</button>
    <button class="main-btn" onclick="closeParentLock()">Iptal</button>
  </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/miniFaceCanvas.js"></script>
<script src="js/settings.js"></script>

</body>
</html>
